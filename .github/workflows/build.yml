name: Build Target APK
on:
  workflow_dispatch:
    inputs:
      uid:
        description: 'Target UID'
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Inject UID
        run: sed -i 's/YOUR_UID_PLACEHOLDER/${{ github.event.inputs.uid }}/g' android-app/app/src/main/java/com/androapp/Config.java
      - name: Grant execute permission for gradlew
        run: chmod +x android-app/gradlew
      - name: Build APK
        working-directory: android-app
        run: ./gradlew assembleDebug
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_number }}
          files: android-app/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
