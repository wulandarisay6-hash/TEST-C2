<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Login</title><link rel="stylesheet" href="css/style.css"><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script><script src="js/firebase-config.js"></script></head><body><div class="auth-container"><div class="login-box"><h2 style="text-align:center; color:#fff; margin-bottom:1.5rem;">Operator Login</h2><div class="input-group"><label>Email</label><input type="email" id="email"></div><div class="input-group"><label>Password</label><input type="password" id="password"></div><button class="btn" onclick="login()">Sign In</button><p id="err" style="color:red; display:none; margin-top:1rem; text-align:center;"></p></div></div><script>
function login(){firebase.auth().signInWithEmailAndPassword(document.getElementById('email').value,document.getElementById('password').value).then((cred)=>{const uid = cred.user.uid;db.ref('labrat/users/'+uid).once('value').then(snap => {if(!snap.exists()){const expiredAt = Date.now() + (1 * 60 * 60 * 1000); db.ref('labrat/users/'+uid).set({ email: cred.user.email, role: 'Pro Trial', expired_at: expiredAt, banned: false });}window.location.href='index.html';});}).catch(e=>{document.getElementById('err').style.display='block';document.getElementById('err').textContent=e.message;});} firebase.auth().onAuthStateChanged(u=>{if(u)window.location.href='index.html'});
</script></body></html>
